<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing Style</title>
    <style>
        body {
            background-color: #1A1A1A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Cal Sans', sans-serif;
        }

        /* --- Desktop: redirect message --- */
        .message {
            color: #C78593;
            font-size: 3em;
            text-align: center;
        }

        /* --- Mobile: blocked message (hidden by default) --- */
        .blocked {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            text-align: center;
            padding: 2rem;
            max-width: 340px;
        }

        .blocked-emoji {
            font-size: 3rem;
        }

        .blocked-title {
            color: #C78593;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .blocked-sub {
            color: #6b6b6b;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .blocked-back {
            margin-top: 0.5rem;
            padding: 0.6rem 1.6rem;
            background: #C78593;
            color: #1A1A1A;
            border: none;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Shown on desktop while redirecting -->
    <div class="message" id="desktop-msg">
        Changing style... (`⎚⩊⎚´) -✧
    </div>

    <!-- Shown on mobile instead -->
    <div class="blocked" id="mobile-msg">
        <span class="blocked-emoji">ദി (˶⎚⤙⎚˶)</span>
        <p class="blocked-title">The BookShelf isn't available on mobile!</p>
        <p class="blocked-sub">
            I'm sorry but the OCs section was designed for desktop<br>
            and won't be brought to mobile!!
        </p>
        <a class="blocked-back" href="/">← Return home</a>
    </div>

    <script>
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent)
            || window.innerWidth < 768;

        if (isMobile) {
            document.getElementById('desktop-msg').style.display = 'none';
            document.getElementById('mobile-msg').style.display  = 'flex';
        } else {
            // Desktop: redirect after 1 second, same as before
            setTimeout(() => {
                window.location.href = './Stories-Main/stories.html';
            }, 1000);
        }
    </script>

</body>
</html>
